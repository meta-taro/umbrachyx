[package]
name = "umbrachyx"
description = "An in-memory database that keeps every change as history."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-siv = { version = "0.8.0", default-features = false, features = ["alloc"] }
# Held at 0.9.2, which aes-siv would otherwise take newer. From 0.9.3 the
# cipher uses 512-bit registers wherever the processor has them, and sets
# them up again for every call: for values of a few bytes that costs more
# than the encryption. See docs/decisions.md, "The store".
aes = { version = "=0.9.2", default-features = false }
biscuit-auth = { version = "6.0.0", default-features = false, features = ["datalog-macro"] }
blake3 = "1.8.7"
crc32fast = "1.5.4"
getrandom = "0.2.17"
mio = { version = "1.2.4", default-features = false, features = ["os-poll", "net"] }
serde_json = "1.0.154"

# The `umbrachyx` binary's memory allocator. Not on Windows, where
# jemalloc does not build with the MSVC toolchain.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.7.0"

# Only for the sync latency example: a plain `fsync`, which std does not
# expose on macOS (its `sync_all` and `sync_data` both use F_FULLFSYNC).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
