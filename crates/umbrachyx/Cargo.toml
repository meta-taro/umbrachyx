[package]
name = "umbrachyx"
description = "An in-memory database that keeps every change as history."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Held at 0.9.2. From 0.9.3 the
# cipher uses 512-bit registers wherever the processor has them, and sets
# them up again for every call: for values of a few bytes that costs more
# than the encryption. Measured: bench/results/2026-11-13-aws-m6id.xlarge-aes/.
# See docs/decisions.md, "The store".
aes = { version = "=0.9.2", default-features = false }
biscuit-auth = { version = "6.0.0", default-features = false, features = ["datalog-macro"] }
blake3 = "1.8.7"
cipher = "0.5.2"
cmac = "0.8.0"
crc32fast = "1.5.4"
ctr = "0.10.1"
dbl = "0.5.0"
digest = { version = "0.11.3", features = ["mac"] }
getrandom = "0.2.17"
mio = { version = "1.2.4", default-features = false, features = ["os-poll", "net"] }
serde_json = "1.0.154"
subtle = "2.6.1"
# TLS 1.3 only (no `tls12`). `prefer-post-quantum` puts the hybrid key
# exchange first; without it both ends settle on the classical one.
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum"] }

# The `umbrachyx` binary's memory allocator. Not on Windows, where
# jemalloc does not build with the MSVC toolchain.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.7.0"

# Only for the sync latency example: a plain `fsync`, which std does not
# expose on macOS (its `sync_all` and `sync_data` both use F_FULLFSYNC).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
# What `store/siv.rs` is checked against, byte for byte.
aes-siv = { version = "0.8.0", default-features = false, features = ["alloc"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
