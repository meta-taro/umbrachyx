[package]
name = "umbrachyx"
description = "An in-memory database that keeps every change as history."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast = "1.5.4"

# Only for the sync latency example: a plain `fsync`, which std does not
# expose on macOS (its `sync_all` and `sync_data` both use F_FULLFSYNC).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
