# Verification for every change that reaches an integration branch.
#
# The Linux runner is the correctness gate. Durability behaves differently
# per OS (macOS `fsync` does not reach the disk without `F_FULLFSYNC`), and
# Linux is the platform the project's guarantees are stated against.
#
# Security posture: least privilege (`contents: read`), no secrets read, and
# only first-party actions. The toolchain comes from `rust-toolchain.toml`
# through the rustup already on the runner, not from a third-party action.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, 'feature/**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Windows is here because most machines this is meant to run on are
    # Windows: durability has to be shown there, not inferred from Linux.
    # Its disk is virtual, so its timings are reference values only.
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # The full kill-during-writes run: 1,000 rounds of killing the writer
      # (SIGKILL, or TerminateProcess on Windows) while the log is being
      # appended to, checking that no acknowledged write is lost.
      - name: crash test (1,000 rounds)
        run: cargo test --test crash --locked -- --ignored --nocapture

      # Deterministic simulation of the log over a simulated disk: power cuts
      # that tear sectors, failed syncs and bit flips, chosen by each seed.
      # A failure prints the one-line command that replays its seed.
      - name: simulation (10,000 seeds)
        run: cargo test -p umbrachyx --lib --locked sim::run::tests::ten_thousand_seeds -- --ignored --exact --nocapture

      - name: sync latency (reference only)
        run: cargo run --release --locked --example sync_latency
