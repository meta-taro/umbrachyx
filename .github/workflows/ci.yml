# Verification for every change that reaches an integration branch.
#
# The Linux runner is the correctness gate. Durability behaves differently
# per OS (macOS `fsync` does not reach the disk without `F_FULLFSYNC`), and
# Linux is the platform the project's guarantees are stated against.
#
# Security posture: least privilege (`contents: read`; the one job that
# publishes the image may also write packages, with the run's own token),
# no stored secrets read, and only first-party actions. The toolchain
# comes from `rust-toolchain.toml` through the rustup already on the
# runner, not from a third-party action.
name: ci

on:
  push:
    branches: [develop, main]
    # A version's tag runs everything once more and then publishes the
    # container image (the `publish` job); nothing else publishes.
    tags: ['v*']
  pull_request:
    branches: [develop, main, 'feature/**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Windows is here because most machines this is meant to run on are
    # Windows: durability has to be shown there, not inferred from Linux.
    # Its disk is virtual, so its timings are reference values only.
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A test that waits for ever fails the job here, not after six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # The full kill-during-writes run: 1,000 rounds of killing the writer
      # (SIGKILL, or TerminateProcess on Windows) while the log is being
      # appended to, checking that no acknowledged write is lost.
      - name: crash test (1,000 rounds)
        run: cargo test -p umbrachyx --test crash --locked -- --ignored --nocapture

      # The same, end to end: 100 rounds of killing `umbrachyx serve` while
      # 16 clients send SETs over the Redis protocol, half of them
      # pipelined, checking that every acknowledged SET is there afterwards.
      # Release mode, because the server replays the whole log at every start.
      - name: server crash test (100 rounds)
        run: cargo test -p umbrachyx --release --test server_crash --locked -- --ignored --nocapture

      # Deterministic simulation over a simulated disk and clock, for the log
      # (torn sectors, failed syncs, bit flips) and for the store on top of it
      # (multi-key commits, crashes, a clock that goes back). Release mode,
      # since the same seeds give the same results and it is ten times faster.
      # A failure prints the one-line command that replays its seed.
      - name: simulation (10,000 seeds)
        run: cargo test -p umbrachyx --lib --release --locked ten_thousand_seeds -- --ignored --nocapture

      - name: sync latency (reference only)
        run: cargo run -p umbrachyx --release --locked --example sync_latency

  bench:
    # Every change is measured against Valkey on the same runner, so a
    # slowdown shows up in the change that caused it. A shared virtual
    # machine is noisy: these numbers are for comparing runs of this job,
    # and docs/comparison.md keeps them apart from the laptop's tables.
    # The raw output is kept as an artifact of each run.
    name: bench (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      VALKEY_VERSION: 9.1.3
    defaults:
      run:
        # Named explicitly so a pipe into `tee` fails when the script does.
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Built from the release tag rather than taken from the distribution,
      # so the version matches the one in docs/comparison.md.
      - name: Build Valkey
        run: |
          git clone --quiet --depth 1 --branch "$VALKEY_VERSION" https://github.com/valkey-io/valkey.git "$RUNNER_TEMP/valkey"
          make -C "$RUNNER_TEMP/valkey" -j"$(nproc)" BUILD_TLS=no >/dev/null
          echo "$RUNNER_TEMP/valkey/src" >> "$GITHUB_PATH"

      - name: Umbrachyx over the Redis protocol
        run: bench/umbrachyx.sh | tee bench-umbrachyx.csv

      - name: Valkey
        run: bench/valkey.sh | tee bench-valkey.csv

      # Linux allows a process far more threads than macOS, where Umbrachyx
      # could not serve 10,000 connections; this shows whether that limit is
      # the platform's or the design's.
      - name: Many connections
        run: |
          ulimit -n 65536
          bench/connections.sh | tee bench-connections.csv

      # Umbrachyx keeps every SET as history, so its memory grows with
      # every write; this keeps that cost in view next to the speed, with
      # and without a table that keeps only its latest values.
      - name: Memory
        run: bench/memory.sh | tee bench-memory.csv

      # What one write costs the store with the disk and the network taken
      # out, on a million keys, written 1, 64 and 3,200 to a sync: how much
      # of a write over the server is the store's own work, and how much
      # writing together saves.
      - name: Commit cost in process
        run: |
          cargo build --quiet --release --locked -p umbrachyx --example commit_cost
          for group in 1 64 3200; do
            target/release/examples/commit_cost 1000000 640000 sealed "$group"
          done | tee bench-commit-cost.txt
          # An experiment, not what the server does: the allocator asking
          # the kernel for huge pages, to see how much of a write's cost
          # is finding its memory. Kept apart so the rows above stay
          # comparable from run to run.
          cat /sys/kernel/mm/transparent_hugepage/enabled | tee bench-commit-cost-huge-pages.txt
          for group in 1 64; do
            _RJEM_MALLOC_CONF=thp:always,metadata_thp:always \
              target/release/examples/commit_cost 1000000 640000 sealed "$group"
          done | tee -a bench-commit-cost-huge-pages.txt

      - name: Summary
        run: |
          {
            echo "### Benchmarks (shared runner, compare runs of this job only)"
            for file in bench-umbrachyx.csv bench-valkey.csv bench-connections.csv bench-memory.csv bench-commit-cost.txt bench-commit-cost-huge-pages.txt; do
              echo
              echo "\`$file\`"
              echo
              echo '```'
              cat "$file"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: |
            bench-*.csv
            bench-*.txt

  image:
    # The container image is built and tried on every change, on both
    # processor families it is published for, each on a runner of its own
    # kind rather than under emulation.
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t umbrachyx:ci .

      # Serve on a volume, write, kill the container, start another on the
      # same volume and read the write back; `docker stop` ends it at once.
      - name: Try the image
        run: docker/smoke.sh umbrachyx:ci

      - name: Keep the image for publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save umbrachyx:ci | gzip > image-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 1

  publish:
    # Only for a version's tag, and only after the tests, the robustness
    # runs and the image's own check passed on that commit. It pushes the
    # very images the `image` job tried, under the version and `latest`.
    name: publish image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true

      - name: Push both images and one name for the two
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker load < "image-$arch.tar.gz"
            docker tag umbrachyx:ci "$repository:$version-$arch"
            docker push "$repository:$version-$arch"
          done
          for tag in "$version" latest; do
            docker manifest create "$repository:$tag" "$repository:$version-amd64" "$repository:$version-arm64"
            docker manifest push "$repository:$tag"
          done
