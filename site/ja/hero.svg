<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 516" role="img" aria-label="端末">
<style>
.bg{fill:#fbfbfd}.bar{fill:#eeeef2}.t{font:16.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1c1c22;white-space:pre}
.c{fill:#9b9ba5}.p{fill:#63636e}.bad{fill:#c2410c;font-weight:700}.ok{fill:#5b5bd6;font-weight:700}.dot{fill:#d4d4dc}
@media (prefers-color-scheme: dark){.bg{fill:#141418}.bar{fill:#1c1c22}.t{fill:#f4f4f6}.c{fill:#6b6b76}.p{fill:#a0a0ab}.bad{fill:#fb923c}.ok{fill:#7c7cf0}.dot{fill:#34343d}}
</style>
<rect class="bg" width="1200" height="516" rx="12"/>
<path class="bar" d="M0 12a12 12 0 0 1 12-12h1176a12 12 0 0 1 12 12v26H0z"/>
<circle class="dot" cx="26" cy="19" r="6"/><circle class="dot" cx="48" cy="19" r="6"/><circle class="dot" cx="70" cy="19" r="6"/>
<text class="t c" x="34" y="82" xml:space="preserve"># AI エージェントの変更は、自分の枝で待つ。人が差分を読むと、1 人だけ 50 個になっている</text>
<text class="t p" x="34" y="112" xml:space="preserve">$ umbrachyx diff main agent/liveops</text>
<text class="t " x="34" y="142" xml:space="preserve">~ player/8/item/potion: 1 -&gt; 6</text>
<text class="t bad" x="34" y="172" xml:space="preserve">~ player/9/item/potion: 0 -&gt; 50</text>
<text class="t c" x="34" y="232" xml:space="preserve"># エージェントが直し、直った変更を人が名前を残して承認する</text>
<text class="t p" x="34" y="262" xml:space="preserve">$ umbrachyx merge main agent/liveops-2 --who lead:liveops \</text>
<text class="t p" x="34" y="292" xml:space="preserve">    --why &quot;outage compensation checked&quot; --approved-by lead:liveops</text>
<text class="t ok" x="34" y="322" xml:space="preserve">merged 4f0c2a91d3b7</text>
<text class="t c" x="34" y="382" xml:space="preserve"># あとから値に聞く。変更ごとに、誰が・なぜ・誰が承認したか</text>
<text class="t p" x="34" y="412" xml:space="preserve">$ umbrachyx history main player/9/item/potion</text>
<text class="t ok" x="34" y="442" xml:space="preserve">2026-11-13T02:51:07Z  4f0c2a91d3b7  5  by lead:liveops  &quot;outage compensation checked&quot;  approved by lead:liveops</text>
<text class="t " x="34" y="472" xml:space="preserve">2026-11-13T02:50:41Z  a51643df05bd  0  by game:server  &quot;state before the outage&quot;</text>
</svg>
